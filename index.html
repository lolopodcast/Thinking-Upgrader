  m2_p2:"溯因推理（Abduction）：已知結果 + 規則 → 推測原因。這是最具創意但最不確定的推理，因為相同結果可能有多種原因。偵探的直覺就是溯因：「地上有血跡（結果）＋ 刀傷會留血（規則）→ 可能是刀傷（原因假說）」。商業應用：看到銷售下滑，溯因推測可能原因清單。",
  m2_p3:"歸納推理（Induction）：從多個具體案例 → 歸納出普遍規律。例：「分析過去五年資料，凡高於千元且無以舊換新方案的手機必定滯銷」。歸納的強度取決於案例的數量與多樣性，容易犯「以偏概全」的錯誤。演繹推理（Deduction）：從普遍規則 + 特定原因 → 預測必然結果。例：「所有人終將一死（規則）＋ 蘇格拉底是人（原因）→ 蘇格拉底終將一死（結論）」。演繹的結論是必然的，但前提必須為真。",

    {q:"「人皆終將一死。蘇格拉底是人。∴ 蘇格拉底終將一死。」是哪種推理？",opts:["溯因推理","歸納推理","演繹推理","類比推理"],ans:_A2,exp:"演繹推理從普遍規則推導必然結果，前提為真則結論必為真。"},
    {q:"科學家觀察 100 隻天鵝均為白色，因此得出「所有天鵝都是白色」——此推理最大的風險是？",opts:["演繹謬誤","草率概括","滑坡謬誤","訴諸權威"],ans:_A1,exp:"這是典型的歸納推理，風險在於樣本不足（確實存在黑天鵝），犯了草率概括謬誤。"},
    {q:"商業情境中，銷售下滑後的第一步分析通常應運用？",opts:["演繹推理（預測結果）","歸納推理（找規律）","溯因推理（生成假說清單）","類比推理"],ans:_A2,exp:"面對未知的銷售下滑原因，溯因推理最適合用來快速生成可能的原因假說清單，再逐一驗證。"},
    {q:"「訴諸權威」謬誤的核心問題是什麼？",opts:["引用的案例數量不足","以權威身份取代邏輯論證作為支持理由","誇大連鎖因果效應","扭曲對方原始論點"],ans:_A1,exp:"訴諸權威（Appeal to Authority）以「大師這麼說」替代嚴謹的邏輯推論，是一種邏輯謬誤——即使權威說的可能正確，也需要獨立的論據支撐。"},
    {q:"下列何者最能體現「演繹推理」的特性？",opts:["從個案出發尋找共同規律","前提為真時結論必為真","結論比前提更具創意空間","結論只具機率性而非必然性"],ans:_A1,exp:"演繹推理（Deduction）的核心特性是：若所有前提均為真，結論在邏輯上必為真，不存在例外空間。"},
  ],

  m3_nav:"3. 研究", m3_title:"Ch3：研究 — 選擇對的方法",
  m3_overview:"研究是反覆尋找（Re-search）真相的系統性過程。沒有最好的研究方法，只有最適合當下問題的方法。量化與質性研究各有其功能，互補而非對立。",
  m3_highlights:["量化研究","質性研究","研究設計","效度與信度","混合方法","脈絡敏感度"],
  m3_p1:"研究的本質是解決「不知道」。量化研究像一把尺，測量世界：高度、體重、因果強度。它的優勢在於可複製性與統計推論，適合回答「有多大影響？」或「真的有因果關係嗎？」等問題。質性研究像一本小說，詮釋世界：脈絡、情緒、意義。它的優勢在於深度與豐富性，適合回答「為什麼？」或「怎麼發生的？」等問題。",
  m3_p2:"Netflix 是混合研究方法的典範。他們用量化大數據精確知道「你在哪一分鐘暫停、在哪一集棄劇」，但數字告訴不了他們「為什麼」。為此，他們同時進行質性焦點訪談，才發現觀眾棄劇的原因往往不是劇情無趣，而是主角的情感線缺乏真實感。量化給出「What」，質性提供「Why」，兩者缺一不可。",
  m3_p3:"研究設計的三個核心決策：（1）研究問題：你要回答的是「是什麼」、「有多大」還是「為什麼」？（2）資料蒐集：問卷、實驗、訪談、觀察、現有資料庫？（3）分析方法：迴歸分析、主題分析、個案比較？這三個決策必須彼此一致，否則研究設計就會出現內部矛盾。",
  m3_p4:"效度（Validity）與信度（Reliability）是評估研究品質的兩把尺。效度問的是「你真的測量到你想測量的東西嗎？」信度問的是「重複測量結果一致嗎？」兩者皆高，研究才具可信度。常見錯誤：問卷題目語意模糊（低效度）、訪談者偏見（低信度）。",
  m3_wrapup:"選擇研究方法前，先明確定義研究問題的性質。如果問題是描述性的（是什麼？有多少？），優先考慮量化；如果是探索性的（為什麼？怎麼運作的？），優先考慮質性；如果兩者皆有，設計混合方法研究。方法服務問題，而非問題服務方法。",
  m3_terms:[
    {front:"量化研究 Quantitative",back:"以數字、測量與統計為核心，目標是一般化與因果強度的確認。適合「有多大影響？」類問題。"},
    {front:"質性研究 Qualitative",back:"以語言、意義與脈絡詮釋為核心，目標是深度理解。適合「為什麼？」類問題。"},
    {front:"混合方法 Mixed Methods",back:"同時運用量化與質性，以量化確認規模，以質性解釋機制，互補不足。"},
    {front:"效度 Validity",back:"研究工具是否真正測量到目標構念。分為內部效度（因果推論正確）與外部效度（可推論至其他情境）。"},
    {front:"信度 Reliability",back:"測量工具的穩定性與一致性。重複測量同一現象應得到相近結果。"},
    {front:"脈絡 Context",back:"賦予數據意義的情境：Who / When / Where / Cultural background。忽略脈絡是誤讀數據的主因。"},
  ],
  m3_q:[
    {q:"想了解「使用者為何感到挫折」，最適合哪種研究方法？",opts:["量化問卷調查","質性深度訪談","大規模實驗","統計迴歸分析"],ans:_A1,exp:"質性研究擅長探索「為什麼」，深度訪談可挖掘使用者的情緒脈絡與深層動機。"},
    {q:"想驗證「廣告曝光量」是否顯著提升「購買意願」，最適合哪種方法？",opts:["焦點團體訪談","量化實驗或問卷（迴歸分析）","民族誌觀察","個案研究"],ans:_A1,exp:"量化研究可測量兩變數間的因果強度，迴歸分析可控制干擾變數。"},
    {q:"「效度」的核心問題是？",opts:["重複測量結果是否一致？","是否真正測量到你想測量的構念？","樣本數是否足夠？","資料是否有偏差？"],ans:_A1,exp:"效度（Validity）問的是測量工具與目標構念之間的對應程度，是否真的測到想測的東西。"},
    {q:"Netflix 同時使用大數據分析與質性焦點訪談，這屬於？",opts:["單純量化研究","單純質性研究","混合方法研究","行動研究"],ans:_A2,exp:"混合方法研究同時運用量化與質性，用量化確認「What」，用質性解釋「Why」。"},
    {q:"研究設計中，「研究問題、資料蒐集、分析方法」三個核心決策之間應該是什麼關係？",opts:["依研究者偏好各自獨立決定","分析方法決定後再決定問題","三者必須彼此一致，環環相扣","只要樣本夠大，三者無需一致"],ans:_A2,exp:"研究設計的三個核心決策必須彼此一致：問題性質決定資料蒐集方式，資料型態決定分析方法，任一環節不一致都會造成研究的內部矛盾。"},
    {q:"問卷題目語意模糊，受訪者各自有不同解讀，這最可能損害研究的？",opts:["外部信度","內部信度","內容效度","統計檢定力"],ans:_A2,exp:"題目語意模糊導致不同受訪者測量到不同構念，傷害的是內容效度（Content Validity）——工具是否真正測到目標構念。"},
  ],

  m4_nav:"4. 分析", m4_title:"Ch4：分析 — 辯證產出洞見",
  m4_overview:"分析不是選邊站，而是透過辯證邏輯（正→反→合）整合對立觀點，產出比任一方更高層次的洞見。真正的分析師找的是「第三條路」。",
  m4_highlights:["辯證邏輯","正反合","拆解診斷整合","洞見生成","MECE 原則","第三條路"],
  m4_p1:"分析（Analysis）的詞源是希臘文的「拆解」。分析 = 拆解（Separate）＋ 診斷（Diagnose）＋ 整合（Integrate）。許多人停留在「拆解」層次，卻未能完成「整合」，因此只能呈現資訊，無法產出洞見。真正的洞見，來自於發現並解決矛盾。",
  m4_p2:"辯證邏輯（Dialectic Logic）是洞見生成的核心架構：正（Thesis）：主流觀點或現狀。反（Anti-thesis）：對立觀點或矛盾。合（Synthesis）：整合雙方真理的更高層次解方。「合」不是妥協（取平均值），而是發現一個更高層次的視角，使「正」與「反」的矛盾不再存在。",
  m4_p3:"Toyota 電動車策略是辯證邏輯的絕佳案例。正：全球電動車趨勢，必須全面純電。反：充電基礎設施不足、電池供應鏈未成熟、氫能技術潛力未發揮。合：「多元路徑（Multi-Pathway）」策略——敵人是碳排放，不是內燃機。同時推進純電、油電混合、氫燃料電池，依市場成熟度動態分配資源。這個「合」使得「全純電 vs 不轉型」的虛假二元對立消失了。",
  m4_p4:"MECE 原則（Mutually Exclusive, Collectively Exhaustive）是拆解的品質標準：「相互獨立、全體窮盡」。好的分析拆解，各項目之間沒有重疊，且加總起來覆蓋問題的全部面向。BCG、McKinsey 的顧問架構（如 7S、五力分析）之所以有說服力，核心在於它們符合 MECE 原則。",
  m4_wrapup:"分析不是列清單，而是發現矛盾、解決矛盾。每次完成一份分析，問自己三個問題：「我找到了什麼矛盾？我的整合洞見比任一方更高層次嗎？這個結論符合 MECE 原則嗎？」這三個問題，是分析品質的最終檢核。",
  m4_terms:[
    {front:"辯證邏輯 Dialectic",back:"透過正（Thesis）→ 反（Anti-thesis）→ 合（Synthesis）的三步驟，化解矛盾產出洞見。"},
    {front:"Thesis（正）",back:"主流觀點、現狀或初始命題。分析的起點。"},
    {front:"Anti-thesis（反）",back:"對立觀點、矛盾或現狀的侷限。「反」不是否定，而是揭示「正」的邊界。"},
    {front:"Synthesis（合）",back:"更高層次的洞見，整合「正」與「反」的真理，使矛盾消解。不是妥協取平均。"},
    {front:"MECE 原則",back:"Mutually Exclusive, Collectively Exhaustive。相互獨立（不重疊）、全體窮盡（不遺漏）。"},
    {front:"洞見 Insight",back:"超越表象資訊的深層理解，通常源自發現並解決矛盾。是分析的最高產出。"},
  ],
  m4_q:[
    {q:"辯證邏輯中「合（Synthesis）」的正確定義是？",opts:["正反兩方取平均值","忽略反方論點只保留正方","發現更高層次視角使正反矛盾消解","選擇支持者更多的一方"],ans:_A2,exp:"「合」是超越「正」與「反」的更高層次洞見，使矛盾不再存在，而非妥協取中間值。"},
    {q:"「MECE 原則」的完整意涵是？",opts:["相互依存、全體代表","相互獨立、全體窮盡","相互比較、全體排序","相互補充、全體整合"],ans:_A1,exp:"MECE = Mutually Exclusive（不重疊）+ Collectively Exhaustive（不遺漏）。"},
    {q:"Toyota「多元路徑」電動車策略在辯證邏輯中屬於？",opts:["正（Thesis）","反（Anti-thesis）","合（Synthesis）","假說（Hypothesis）"],ans:_A2,exp:"「多元路徑」整合了「全純電」與「不轉型」兩方真理，是超越對立的「合」。"},
    {q:"分析的三個步驟依序是？",opts:["整合→診斷→拆解","拆解→整合→診斷","拆解→診斷→整合","診斷→拆解→整合"],ans:_A2,exp:"分析 = 拆解（Separate）→ 診斷（Diagnose）→ 整合（Integrate）。"},
    {q:"一份市場分析將客群分為「18–35 歲」與「30–50 歲」兩組，違反了 MECE 的哪個要求？",opts:["全體窮盡（有年齡層被遺漏）","相互獨立（30–35 歲重疊）","資料來源不一致","未使用標準行銷架構"],ans:_A1,exp:"「30–35 歲」同時落在兩個區間，造成重疊，違反 Mutually Exclusive（相互獨立、不重疊）原則。"},
    {q:"真正的「洞見（Insight）」與普通的「資訊彙整」最大的差異是？",opts:["洞見的數據量更多","洞見通常來自發現並解決矛盾","洞見的報告格式更精美","洞見需要更長的時間蒐集"],ans:_A1,exp:"洞見是超越表象資訊的深層理解，通常源自發現矛盾（正反衝突）並透過辯證整合產出的「合」。"},
  ],

  m5_nav:"5. 假說", m5_title:"Ch5：假說 — 變數模型與驗證",
  m5_overview:"強大的論證建立在清晰的變數關係之上。用「變數積木」建立 X→Me→Y（Mo）模型，再透過資料或邏輯一致性加以驗證，是學術研究與商業策略分析的共同語言。",
  m5_highlights:["解釋變數 X","被解釋變數 Y","中介變數 Me","干擾變數 Mo","假說建立","驗證策略"],
  m5_p1:"假說不是猜測，而是「可驗證的猜測」。好的假說具備三個特質：明確性（清楚說明 X 如何影響 Y）、可否證性（能被資料或邏輯推翻）、理論基礎（有既有文獻或機制說明支撐）。「我覺得廣告有效」不是假說；「廣告曝光量（X）透過品牌熟悉度（Me）正向影響購買意願（Y）」才是假說。",
  m5_p2:"變數模型的四個積木：X（解釋變數，Cause）：你認為會產生影響的因子。Y（被解釋變數，Effect）：你想解釋或預測的結果。Me（中介變數，Mediator）：X 影響 Y 的路徑或機制（解釋「為什麼」）。Mo（干擾變數，Moderator）：改變 X→Y 關係強度或方向的條件（解釋「在什麼情況下」）。",
  m5_p3:"網紅行銷案例：網紅（X）→ 信任感（Me）→ 購買意願（Y）；但若產品定價過高（Mo），信任感對購買意願的轉化效果大幅降低。這個模型說明：網紅行銷的效果取決於「信任感能否跨越價格門檻」——這正是許多奢侈品品牌不採用一般網紅策略的原因。",
  m5_p4:"驗證策略依研究性質分兩路：量化驗證——透過問卷蒐集數據，以結構方程模型（SEM）或迴歸分析檢驗 Me 與 Mo 的作用。質性驗證——透過深度訪談或個案分析，確認機制邏輯是否在現實中成立。兩種驗證方式互補，結合使用可大幅提升論證的可信度。",
  m5_wrapup:"假說建立是思維升級的頂層技能：它要求你同時具備觀察力（找出 X、Y）、邏輯力（說明 Me 的機制）、分析力（預測 Mo 的邊界條件）與探究能力（設計驗證方案）。掌握變數模型，你就掌握了學術論文與商業策略報告的共同骨架。",
  m5_terms:[
    {front:"解釋變數 X (Predictor)",back:"你認為會產生影響的原因變數。又稱自變數（Independent Variable）。"},
    {front:"被解釋變數 Y (Outcome)",back:"你想解釋或預測的結果變數。又稱依變數（Dependent Variable）。"},
    {front:"中介變數 Me (Mediator)",back:"X 影響 Y 的中間路徑，解釋「為什麼」X 會影響 Y 的機制。"},
    {front:"干擾變數 Mo (Moderator)",back:"改變 X→Y 因果關係強度或方向的條件變數，解釋「在什麼情況下」效果不同。"},
    {front:"可否證性 Falsifiability",back:"好假說的核心特質：能夠被資料或反例推翻。不可否證的命題不是科學假說。"},
    {front:"結構方程模型 SEM",back:"Structural Equation Modeling：同時檢驗多個變數關係（含 Me 與 Mo）的統計方法。"},
  ],
  m5_q:[
    {q:"「廣告曝光量（X）→ 品牌熟悉度（Me）→ 購買意願（Y）」中，品牌熟悉度扮演什麼角色？",opts:["解釋變數","被解釋變數","中介變數","干擾變數"],ans:_A2,exp:"中介變數（Mediator）是 X 影響 Y 的中間路徑，說明「為什麼」X 會影響 Y。"},
    {q:"「當消費者風險意識高時，廣告效果顯著降低」中，「風險意識」是什麼變數？",opts:["解釋變數 X","被解釋變數 Y","中介變數 Me","干擾變數 Mo"],ans:_A3,exp:"干擾變數（Moderator）改變 X→Y 因果關係的強度或方向，回答「在什麼條件下效果不同」。"},
    {q:"好的研究假說必須具備哪個核心特質？",opts:["支持現有主流觀點","可被資料或反例推翻（可否證性）","樣本數足夠大","有數學公式支撐"],ans:_A1,exp:"可否證性（Falsifiability）是科學假說的核心。不可被推翻的命題，不屬於科學範疇。"},
    {q:"量化驗證 Me（中介變數）最常用的統計方法是？",opts:["描述性統計","交叉分析表","結構方程模型（SEM）或中介分析","卡方檢定"],ans:_A2,exp:"SEM 或 Baron-Kenny 中介分析法是驗證中介效果的主流量化方法。"},
    {q:"「我覺得廣告有效」與「廣告曝光量（X）透過品牌熟悉度（Me）正向影響購買意願（Y）」兩者的關鍵差異是？",opts:["前者更簡潔，後者太複雜","後者明確指出變數與機制，具可否證性","前者是質性，後者是量化","兩者在研究上等價，只是表達不同"],ans:_A1,exp:"好的假說必須明確 X、Y 與 Me 的關係，並具有可否證性；「我覺得有效」無法被測量或推翻，不符合科學假說標準。"},
    {q:"下列哪種說法最能區分「中介變數（Me）」與「干擾變數（Mo）」？",opts:["Me 是連續變數，Mo 是類別變數","Me 解釋 X 影響 Y 的機制（為什麼），Mo 決定 X→Y 效果的強弱（在什麼條件下）","Me 置於模型左側，Mo 置於右側","兩者在統計上無法區分"],ans:_A1,exp:"中介變數回答「為什麼 X 影響 Y」（路徑），干擾變數回答「在什麼條件下 X 對 Y 的影響會改變」（邊界條件），兩者概念截然不同。"},
  ],

  m6_nav:"6. 資料敘事", m6_title:"Ch6：資料敘事 — 用數據說服人",
  m6_overview:"數據本身不會說話，需要人賦予它敘事結構。資料敘事（Data Storytelling）是將數據、視覺化與敘事三者整合，產出能讓決策者行動的溝通工具。",
  m6_highlights:["資料視覺化","敘事弧線","SCQA 架構","圖表選擇","聽眾意識","行動呼籲"],
  m6_p1:"資料敘事的核心不是「展示所有數據」，而是「說出最重要的那一件事」。麥肯錫的顧問訓練中，有一個核心原則：每一頁投影片只能有一個核心訊息（One Key Message Per Slide）。數據是支持這個訊息的證據，而非主角本身。",
  m6_p2:"SCQA 架構是資料敘事的骨架：Situation（情境）：建立共識，描述聽眾認可的現狀。Complication（複雜化）：引入轉折，說明為何現狀產生了問題或機會。Question（問題）：明確化核心問題。Answer（答案）：你的洞見與建議。SCQA 確保你的報告從聽眾關心的問題出發，而非從你蒐集的資料出發。",
  m6_p3:"圖表選擇原則：比較（Bar Chart）、趨勢（Line Chart）、比例（Pie/Donut）、分布（Histogram/Box Plot）、關聯（Scatter Plot）。錯誤的圖表類型會誤導判斷。最常見的錯誤是用圓餅圖比較超過 5 個類別，或用折線圖呈現無序類別資料。",
  m6_p4:"聽眾意識（Audience Awareness）是資料敘事的元技能。高階主管需要的是「So what？」（這個數據對業務有什麼影響？）；技術團隊需要的是「How do we know？」（資料的來源與可信度）；一般大眾需要的是「Why should I care？」（與我何關？）。同一組數據，針對不同聽眾需要不同的敘事切入點。",
  m6_wrapup:"數據是手段，決策是目的。好的資料敘事讓聽眾在報告結束時知道：他們需要相信什麼、需要決定什麼、需要做什麼。下次準備數據報告時，從這三個問題出發逆向設計你的敘事——你會發現需要呈現的數據其實遠比你以為的少。",
  m6_terms:[
    {front:"資料敘事 Data Storytelling",back:"將數據、視覺化與敘事結構整合，以影響聽眾理解與決策的溝通能力。"},
    {front:"SCQA 架構",back:"Situation / Complication / Question / Answer。從情境到問題到答案的敘事骨架。"},
    {front:"One Key Message",back:"每頁投影片僅傳達一個核心訊息，其餘數據均為支持證據。麥肯錫報告原則。"},
    {front:"聽眾意識",back:"依聽眾的背景、關切與需求調整資料呈現方式。是資料敘事的元技能。"},
    {front:"Bar Chart 適用時機",back:"比較不同類別的數值大小。水平 Bar 適合類別名稱較長時。"},
    {front:"Scatter Plot 適用時機",back:"探索兩個連續變數之間的關聯或分布模式。可加上趨勢線強化訊息。"},

  m6_q:[
    {q:"SCQA 架構中，「C」代表的是？",opts:["概念（Concept）","複雜化（Complication）","結論（Conclusion）","案例（Case）"],ans:_A1,exp:"C = Complication（複雜化），是引入轉折的環節，說明為何現狀產生了問題或值得關注的機會。"},
    {q:"想呈現「過去 12 個月的銷售趨勢」，最適合哪種圖表？",opts:["圓餅圖（Pie Chart）","折線圖（Line Chart）","散點圖（Scatter Plot）","盒狀圖（Box Plot）"],ans:_A1,exp:"折線圖適合呈現時間序列數據的趨勢變化，是趨勢分析的首選。"},
    {q:"「每頁投影片只能有一個核心訊息」是哪個機構的顧問報告原則？",opts:["BCG","Deloitte","McKinsey","Bain"],ans:_A2,exp:"McKinsey（麥肯錫）以「One Key Message Per Slide」原則聞名，要求每頁標題即為結論性訊息。"},
    {q:"對高階主管進行資料報告時，最關鍵的聽眾問題是？",opts:["資料的來源是哪裡？","統計方法是否嚴謹？","這個數據對業務有什麼影響？","樣本數是否足夠？"],ans:_A2,exp:"高階主管最關心的是「So what?」——數據的業務含義與決策影響，而非技術細節。"},
    {q:"想比較五個品牌的市占率，最不適合的圖表是？",opts:["水平長條圖（Horizontal Bar）","堆疊長條圖（Stacked Bar）","圓餅圖超過 5 個切片","樹狀圖（Treemap）"],ans:_A2,exp:"圓餅圖（Pie Chart）超過 5 個切片時，各切片面積難以視覺辨別，是最常見的圖表誤用。水平長條或樹狀圖均比 Pie 更清晰。"},
    {q:"SCQA 架構中，「S（Situation）」的主要目的是？",opts:["提出讓聽眾驚訝的新資料","建立聽眾已知的現狀共識作為起點","呈現解決方案","定義分析範圍"],ans:_A1,exp:"Situation 的用途是讓聽眾先確認一個他們認可的現狀——這個共識是後續引入 Complication 的基礎，若跳過 S 直接說 C，聽眾容易產生理解斷層。"},

  m0_nav:"0. Overview",
  m0_title:"Thinking Upgrader",
  m0_intro:"In an age of information overload, 'seeing' is not the same as 'understanding', and 'saying something' is not the same as 'persuading someone'. This course is designed for learners who want to move from surface-level observation to systematic critical thinking. It covers six core skills: Observation, Logic, Research, Analysis, Hypothesis, and Data Storytelling — plus an interactive lab and integrated learning tools. Using real business cases (TSMC, Netflix, Toyota) as vehicles, you will learn to separate facts from opinions, choose the right reasoning engine, design rigorous research frameworks, generate insights through dialectics, build testable hypotheses using variable models, and tell convincing stories with data. After completing the six modules, you will have a thinking toolkit applicable to business analysis, academic research, and everyday decision-making.",

  m1_nav:"1. Observation", m1_title:"Ch1: Observation — Separating Facts from Opinions",
  m1_overview:"The cornerstone of critical thinking is rigorously distinguishing between 'Facts' (verifiable objective data) and 'Opinions' (subjective interpretations). Without this discipline, bias contaminates analysis from the very first step.",
  m1_highlights:["Fact vs Opinion","ORID Framework","3W1H Scanning Tool","Cognitive Bias","Remove the Filter","Context Sensitivity"],
  m1_p1:"Observation is the foundation of all thinking skills. An untrained observer mixes subjective judgments into the moment of perception. For example: 'This café's coffee tastes terrible, the staff is grumpy, no wonder nobody buys it' — this sentence contains a sensory judgment (terrible taste), an emotional evaluation (grumpy staff), and a causal assumption (no wonder), none of which are facts. Facts have only one form: data that any third party can measure or verify using the same standard. 'Between 8–9 AM, 50 people entered but only 3 made purchases, with an average wait time of 4 minutes' — that is a fact.",
  m1_p2:"ORID (Objective / Reflective / Interpretive / Decisional) is a structured observation framework that requires us to first record pure sensory data (O), then describe emotional responses (R), then find meaning and patterns (I), and only then make decisions (D). This sequence is critical — jumping from O directly to I is the root of most decision-making errors.",
  m1_p3:"3W1H is an observation scanning tool: What (what objects/events occurred?), Why (what are the reasons?), Context (who, when, where?), How (what is the mechanism?). Used alongside ORID, it produces a structured observation report of any scene in 5 minutes, dramatically reducing the risk of bias entering the analysis.",
  m1_p4:"Cognitive biases are the greatest enemies of observation. Confirmation bias (only noticing information that supports your preset view), the halo effect (overestimating someone's abilities because you like them), and base rate neglect (ignoring statistical backgrounds and focusing only on individual cases) are the three most common biases in business analysis. Recognizing the existence of bias is the first step in 'removing the filter'.",
  m1_wrapup:"Observation is not passively receiving information but actively classifying and filtering it. The core habit for developing observation skills is to ask yourself before any judgment: 'Is this a fact, or is it my interpretation?' Maintain this habit consistently and your analytical quality will transform within three months.",
  m1_terms:[
    {front:"Fact",back:"Objective reality. Observable, measurable data verifiable by any third party. E.g., '50 people entered between 8–9 AM'."},
    {front:"Opinion",back:"Subjective interpretation, evaluation, or emotional response to facts. E.g., 'This store has a terrible atmosphere'."},
    {front:"ORID",back:"Focused Conversation Method. Four sequential layers: O Objective → R Reflective → I Interpretive → D Decisional."},
    {front:"3W1H",back:"Observation scanning framework: What / Why / Context (Who, When, Where) / How."},
    {front:"Confirmation Bias",back:"The tendency to seek and favor information that confirms one's existing beliefs while ignoring contradictory evidence."},
    {front:"Halo Effect",back:"The tendency to let an overall positive impression of a person influence judgments about their specific traits or abilities."},
  ],
  m1_q:[
    {q:"Which of the following is a FACT?",opts:["The clerk looks very lazy today","The coffee machine takes exactly 3 minutes per cup","Customers seem annoyed by the wait","This store has a terrible atmosphere"],ans:_A1,exp:"'3 minutes' is an objectively measurable datum. The other three options contain subjective evaluations or inferences."},
    {q:"In ORID, 'I feel anxious while waiting' belongs to which level?",opts:["Objective","Reflective","Interpretive","Decisional"],ans:_A1,exp:"The Reflective level deals with emotional responses and feelings — our reactions to the objective data."},
    {q:"In 3W1H, 'Context' covers which elements?",opts:["What / Why","Who / When / Where","How / Why","What / How"],ans:_A1,exp:"Context represents the situation: Who (people), When (time), Where (place) — the three contextual elements."},
    {q:"'Confirmation Bias' is best described as?",opts:["Exaggerating the representativeness of one success case","Only attending to information that supports existing beliefs","Overestimating someone's ability because you like them","Underestimating the probability of risk events"],ans:_A1,exp:"Confirmation Bias is the selective intake of information that confirms pre-existing beliefs, ignoring contradictory evidence."},
    {q:"What is the correct execution order of the ORID framework?",opts:["R → O → I → D","O → I → R → D","O → R → I → D","I → O → R → D"],ans:_A2,exp:"ORID must follow the order O (Objective) → R (Reflective) → I (Interpretive) → D (Decisional). Jumping from O directly to I is the root cause of most decision-making errors."},
    {q:"The Halo Effect in business analysis is most likely to cause which problem?",opts:["Collecting too much irrelevant data","Systematically overestimating a person's or brand's specific attributes due to an overall positive impression","Underestimating overall market size","Ignoring competitive dynamics"],ans:_A1,exp:"The Halo Effect causes analysts to overestimate specific capabilities or plan quality due to a general positive feeling about a person or brand, leading to distorted analysis."},
  ],

  m2_nav:"2. Logic", m2_title:"Ch2: Logic — Connecting Causes and Effects",
  m2_overview:"Logic is not simply 'making sense'. It is the correct linkage of Cause, Rule, and Result through three distinct engines: Abduction, Induction, and Deduction — each with its own use case and limitation.",
  m2_highlights:["Abduction","Induction","Deduction","Epistemology vs Ontology","Logical Fallacies","Argument Strength"],
  m2_p1:"Logic bridges our understanding of the world (Epistemology) with the world itself (Ontology). It isn't just inference; it's choosing the right reasoning engine at the right moment. Three engines, each with its role: Abduction is the detective's tool (reasoning backward from result to cause), Induction is the scientist's tool (extracting patterns from cases), Deduction is the strategist's tool (predicting results from rules).",
  m2_p2:"Abductive Reasoning: Known Result + Rule → Inferred Cause. This is the most creative but least certain form of reasoning, because the same result can have multiple causes. The detective's intuition is abductive: 'There's blood on the floor (Result) + A knife wound bleeds (Rule) → Possibly a knife wound (Hypothesized Cause).' Business application: when sales drop, abduction generates a list of possible causes.",
  m2_p3:"Inductive Reasoning: Multiple specific cases → General pattern. E.g., 'Analyzing 5 years of data, any phone priced over $1,000 without a trade-in program always underperforms.' Induction's strength depends on the quantity and diversity of cases — it risks the 'hasty generalization' fallacy. Deductive Reasoning: General rule + Specific cause → Necessary result. E.g., 'All humans are mortal (Rule) + Socrates is human (Cause) → Socrates is mortal (Conclusion).' Deductive conclusions are necessary, but the premises must be true.",
  m2_p4:"Common logical fallacies: Hasty Generalization (generalizing from insufficient cases), Appeal to Authority (believing something because an expert says so), Slippery Slope (exaggerating causal chains), Straw Man (distorting an opponent's argument before refuting it). Identifying these fallacies is the fastest path to improving argument quality.",
  m2_wrapup:"Choosing the right reasoning engine is the key to logical thinking: use abduction to open the hypothesis space, induction to extract patterns from data, deduction to predict strategic outcomes. Use all three in rotation rather than relying exclusively on one, and you will build arguments that are both rigorous and persuasive.",
  m2_terms:[
    {front:"Abduction",back:"Reasoning from Result + Rule to infer the most probable Cause. Used for hypothesis generation; conclusions are probabilistic, not certain."},
    {front:"Induction",back:"Deriving a general pattern from multiple specific cases. Strength depends on sample size and representativeness."},
    {front:"Deduction",back:"Deriving a necessary conclusion from a general rule. When premises are true, the conclusion must be true."},
    {front:"Epistemology",back:"The philosophical study of 'how we know what we know' — concerned with the sources and justification of knowledge."},
    {front:"Hasty Generalization",back:"Drawing a general conclusion from an insufficient number of cases — the most common fallacy in inductive reasoning."},
    {front:"Slippery Slope",back:"Claiming that A will inevitably lead to a chain of negative consequences, without sufficient supporting evidence."},
  ],
  m2_q:[
    {q:"'Wet ground (Result) + Rain makes ground wet (Rule) → It rained (Cause).' What type of reasoning is this?",opts:["Deduction","Induction","Abduction","Reduction"],ans:_A2,exp:"Abduction reasons backward from an effect to the most probable cause. The conclusion is probabilistic — wet ground could also be caused by a sprinkler."},
    {q:"'All humans are mortal. Socrates is human. ∴ Socrates is mortal.' What type of reasoning is this?",opts:["Abduction","Induction","Deduction","Analogy"],ans:_A2,exp:"Deduction applies a general rule to a specific case to derive a necessary conclusion. When premises are true, the conclusion must be true."},
    {q:"A scientist observes 100 white swans and concludes 'all swans are white.' The main risk of this reasoning is?",opts:["Deductive fallacy","Hasty Generalization","Slippery Slope","Appeal to Authority"],ans:_A1,exp:"This is typical inductive reasoning. The risk is insufficient sampling (black swans do exist) — a classic hasty generalization fallacy."},
    {q:"In a business context, the first step after noticing a sales drop should use which type of reasoning?",opts:["Deduction (predict results)","Induction (find patterns)","Abduction (generate hypothesis list)","Analogy"],ans:_A2,exp:"When the cause of a sales drop is unknown, abduction is best for rapidly generating a list of possible causes for subsequent verification."},
    {q:"What is the core problem with an 'Appeal to Authority' fallacy?",opts:["The number of cited cases is insufficient","An authority's position replaces logical argument as the justification","Causal chain effects are exaggerated","The opponent's original argument is distorted"],ans:_A1,exp:"Appeal to Authority substitutes 'an expert said so' for rigorous logical reasoning. Even if the authority happens to be correct, an independent argument is still required to justify the claim."},
    {q:"Which statement best describes the key characteristic of deductive reasoning?",opts:["It starts from individual cases to find common patterns","When all premises are true, the conclusion must be true","The conclusion has more creative space than the premises","Conclusions are probabilistic rather than necessary"],ans:_A1,exp:"The defining feature of Deduction is necessity: if all premises are true, the conclusion must logically follow — there are no exceptions within the argument structure."},
  ],

  m3_nav:"3. Research", m3_title:"Ch3: Research — Choosing the Right Method",
  m3_overview:"Research is the systematic process of 'Re-searching' — iteratively seeking truth. There is no single best method, only the most appropriate tool for the question at hand. Quantitative and qualitative research are complementary, not competing.",
  m3_highlights:["Quantitative Research","Qualitative Research","Research Design","Validity & Reliability","Mixed Methods","Context Sensitivity"],
  m3_p1:"The essence of research is resolving 'not knowing'. Quantitative research is like a ruler — measuring the world: height, weight, causal strength. Its strength lies in replicability and statistical inference, suited for answering 'How large is the effect?' or 'Is there truly a causal relationship?' Qualitative research is like a novel — interpreting the world: context, emotion, meaning. Its strength is depth and richness, suited for answering 'Why?' or 'How does it happen?'",
  m3_p2:"Netflix is a paradigm of mixed methods. They use quantitative big data to know precisely 'at which minute you pause or abandon a series', but numbers can't tell them 'why'. They conduct qualitative focus groups and discover that viewers abandoned shows not because of boring plots, but because characters lacked emotional authenticity. Quantitative gives the 'What'; qualitative provides the 'Why'. Neither alone is sufficient.",
  m3_p3:"Three core decisions in research design: (1) Research Question: Are you asking 'What is it?', 'How much?' or 'Why?' (2) Data Collection: Survey, experiment, interview, observation, or existing database? (3) Analysis Method: Regression, thematic analysis, or case comparison? These three decisions must be internally consistent — otherwise the research design contains a fundamental contradiction.",
  m3_p4:"Validity and Reliability are the two yardsticks for evaluating research quality. Validity asks: 'Are you truly measuring what you intend to measure?' Reliability asks: 'Are repeated measurements consistently producing the same results?' Only when both are high does the research have credibility. Common errors: ambiguous survey wording (low validity), interviewer bias (low reliability).",
  m3_wrapup:"Before choosing a research method, clearly define the nature of your research question. If it is descriptive (What? How many?), prioritize quantitative. If it is exploratory (Why? How does it work?), prioritize qualitative. If both apply, design a mixed method study. The method serves the question — not the other way around.",
  m3_terms:[
    {front:"Quantitative Research",back:"Centered on numbers, measurement and statistics. Goal: generalization and causal strength confirmation. Best for 'How much impact?' questions."},
    {front:"Qualitative Research",back:"Centered on language, meaning and contextual interpretation. Goal: deep understanding. Best for 'Why?' questions."},
    {front:"Mixed Methods",back:"Simultaneously employs quantitative and qualitative approaches — quantity confirms scale, quality explains mechanism. Each compensates for the other's limitations."},
    {front:"Validity",back:"Whether the research instrument truly measures the target construct. Internal validity concerns causal inference; external validity concerns generalizability."},
    {front:"Reliability",back:"The stability and consistency of a measurement tool. Repeated measurements of the same phenomenon should yield similar results."},
    {front:"Context",back:"The circumstantial conditions (Who / When / Where / Cultural background) that give meaning to data. Ignoring context is the primary cause of data misinterpretation."},
  ],
  m3_q:[
    {q:"To deeply understand 'why users feel frustrated', which method is best?",opts:["Quantitative survey","Qualitative in-depth interview","Large-scale experiment","Statistical regression"],ans:_A1,exp:"Qualitative research excels at exploring 'Why' questions, and in-depth interviews can uncover users' emotional context and underlying motivations."},
    {q:"To verify whether 'advertising exposure significantly increases purchase intention', which method is best?",opts:["Focus group interview","Quantitative experiment or survey (regression analysis)","Ethnographic observation","Case study"],ans:_A1,exp:"Quantitative research can measure the causal strength between two variables; regression analysis controls for confounding variables."},
    {q:"The core question of 'Validity' is?",opts:["Are repeated measurements consistent?","Are you truly measuring what you intend to measure?","Is the sample size large enough?","Is the data unbiased?"],ans:_A1,exp:"Validity concerns the correspondence between the measurement tool and the target construct — whether you're actually measuring what you set out to measure."},
    {q:"Netflix simultaneously uses big data analytics and qualitative focus groups. This is?",opts:["Pure quantitative research","Pure qualitative research","Mixed methods research","Action research"],ans:_A2,exp:"Mixed methods research employs both quantitative and qualitative approaches — quantity for 'What', quality for 'Why'."},
    {q:"The three core decisions in research design (research question, data collection, analysis method) should have what relationship?",opts:["Each decided independently based on researcher preference","Analysis method decided first, then the question","All three must be internally consistent and mutually reinforcing","As long as the sample is large enough, consistency is not required"],ans:_A2,exp:"All three core decisions must be mutually consistent: the question's nature determines the collection approach, which determines the analysis method. Inconsistency in any link creates a fundamental contradiction in the research design."},
    {q:"Survey questions with ambiguous wording that different respondents interpret differently most likely damages research?",opts:["External reliability","Internal reliability","Content validity","Statistical power"],ans:_A2,exp:"Ambiguous wording means different respondents are measuring different constructs, damaging Content Validity — whether the instrument truly measures the target concept."},
  ],

  m4_nav:"4. Analysis", m4_title:"Ch4: Analysis — Generating Insights through Dialectics",
  m4_overview:"Analysis is not about picking a side. It is using dialectic logic (Thesis → Anti-thesis → Synthesis) to integrate opposing viewpoints and produce an insight at a higher level than either position. A true analyst finds the 'third path'.",
  m4_highlights:["Dialectic Logic","Thesis-Antithesis-Synthesis","Separate-Diagnose-Integrate","Insight Generation","MECE Principle","The Third Path"],
  m4_p1:"The word 'analysis' derives from the Greek for 'to break apart'. Analysis = Separate + Diagnose + Integrate. Many people stop at the 'Separate' stage and present information without reaching 'Integrate', so they produce information rather than insight. True insight comes from discovering and resolving contradictions.",
  m4_p2:"Dialectic Logic is the core framework for insight generation: Thesis: The mainstream view, current state, or initial proposition. Anti-thesis: The opposing view or contradiction. Synthesis: A higher-level insight that integrates the truths of both thesis and anti-thesis. 'Synthesis' is not compromise (splitting the difference) but discovering a higher-level perspective that dissolves the contradiction.",
  m4_p3:"Toyota's EV strategy is the perfect dialectic case. Thesis: Global EV trend demands full electrification. Anti-thesis: Insufficient charging infrastructure, immature battery supply chains, untapped hydrogen potential. Synthesis: 'Multi-Pathway' strategy — the enemy is carbon emissions, not the combustion engine. Simultaneously advance BEV, hybrid, and hydrogen fuel cells, dynamically allocating resources by market maturity. This 'Synthesis' dissolves the false binary of 'all-EV vs. no transition'.",
  m4_p4:"The MECE principle (Mutually Exclusive, Collectively Exhaustive) is the quality standard for decomposition: items must not overlap, and together must cover all dimensions of the problem. BCG and McKinsey frameworks (7S, Five Forces) are convincing precisely because they are MECE-compliant.",
  m4_wrapup:"Analysis is not listing items — it is discovering and resolving contradictions. After completing any analysis, ask yourself three questions: 'What contradiction did I find? Is my synthetic insight at a higher level than either side? Does this conclusion comply with MECE?' These three questions are the ultimate quality check for analysis.",
  m4_terms:[
    {front:"Dialectic Logic",back:"A three-step process: Thesis → Anti-thesis → Synthesis. Contradictions are resolved to produce higher-level insights."},
    {front:"Thesis",back:"The mainstream view, current state, or initial proposition. The starting point of analysis."},
    {front:"Anti-thesis",back:"The opposing view or contradiction. 'Anti' does not negate the thesis but reveals its boundaries and limitations."},
    {front:"Synthesis",back:"A higher-level insight that integrates the truths of both thesis and anti-thesis, dissolving the contradiction. Not a compromise or average."},
    {front:"MECE Principle",back:"Mutually Exclusive, Collectively Exhaustive. Items must not overlap (exclusive) and must together cover the entire problem space (exhaustive)."},
    {front:"Insight",back:"An understanding that goes beyond surface information, usually arising from discovering and resolving a contradiction. The highest output of analysis."},
  ],
  m4_q:[
    {q:"The correct definition of 'Synthesis' in dialectic logic is?",opts:["Average of Thesis and Anti-thesis","Ignore Anti-thesis and keep Thesis","Discover a higher-level perspective that dissolves the contradiction","Choose whichever side has more supporters"],ans:_A2,exp:"'Synthesis' is a higher-level insight that transcends both Thesis and Anti-thesis, not a compromise or middle ground."},
    {q:"The full meaning of the MECE principle is?",opts:["Mutually Interdependent, Collectively Representative","Mutually Exclusive, Collectively Exhaustive","Mutually Comparable, Collectively Ranked","Mutually Supplementary, Collectively Integrated"],ans:_A1,exp:"MECE = Mutually Exclusive (no overlap) + Collectively Exhaustive (no gaps)."},
    {q:"Toyota's 'Multi-Pathway' EV strategy represents which element of dialectic logic?",opts:["Thesis","Anti-thesis","Synthesis","Hypothesis"],ans:_A2,exp:"'Multi-Pathway' integrates the truths of 'all-EV' and 'no transition', forming a 'Synthesis' that transcends the original opposition."},
    {q:"The three steps of analysis in correct order are?",opts:["Integrate→Diagnose→Separate","Separate→Integrate→Diagnose","Separate→Diagnose→Integrate","Diagnose→Separate→Integrate"],ans:_A2,exp:"Analysis = Separate → Diagnose → Integrate."},
    {q:"A market analysis divides customers into '18–35 years old' and '30–50 years old'. This violates which MECE requirement?",opts:["Collectively Exhaustive (some age groups are omitted)","Mutually Exclusive (ages 30–35 overlap)","Data sources are inconsistent","No standard marketing framework was used"],ans:_A1,exp:"Ages 30–35 fall into both segments simultaneously, creating overlap and violating the Mutually Exclusive (no-overlap) requirement of MECE."},
    {q:"What is the key difference between a true 'Insight' and a mere 'information summary'?",opts:["Insights contain more data points","Insights typically arise from discovering and resolving a contradiction","Insights have a better report format","Insights require longer data collection time"],ans:_A1,exp:"An insight goes beyond surface information — it typically arises from identifying a contradiction (Thesis vs Anti-thesis) and producing a Synthesis that resolves it at a higher level."},
  ],

  m5_nav:"5. Hypothesis", m5_title:"Ch5: Hypothesis — Variable Models & Verification",
  m5_overview:"Strong arguments are built on clear variable relationships. The X→Me→Y(Mo) model combined with data or logical verification is the shared language of academic research and business strategy analysis.",
  m5_highlights:["Predictor X","Outcome Y","Mediator Me","Moderator Mo","Hypothesis Building","Verification Strategy"],
  m5_p1:"A hypothesis is not a guess — it is a 'testable guess'. A good hypothesis has three characteristics: Specificity (clearly states how X affects Y), Falsifiability (can be refuted by data or logic), and Theoretical Grounding (supported by existing literature or a stated mechanism). 'I think advertising works' is not a hypothesis; 'Advertising exposure (X) positively influences purchase intention (Y) through brand familiarity (Me)' is a hypothesis.",
  m5_p2:"The four building blocks of a variable model: X (Predictor/Cause): The factor you believe produces an effect. Y (Outcome/Effect): The result you want to explain or predict. Me (Mediator): The path or mechanism by which X influences Y (explains 'Why'). Mo (Moderator): The condition variable that changes the strength or direction of the X→Y relationship (explains 'Under what conditions').",
  m5_p3:"Influencer marketing case: Influencer (X) → Trust (Me) → Purchase Intention (Y); but if the product is priced too high (Mo), trust's conversion to purchase intention drops sharply. This model explains why many luxury brands do not use mainstream influencer strategies: they require trust to overcome a high price threshold, which most influencers cannot deliver.",
  m5_p4:"Verification strategies split into two paths: Quantitative verification — collect data via surveys, test Me and Mo effects using Structural Equation Modeling (SEM) or regression analysis. Qualitative verification — conduct in-depth interviews or case analyses to confirm whether the mechanism logic holds in reality. The two verification approaches are complementary; combining them significantly enhances argument credibility.",
  m5_wrapup:"Hypothesis building is the apex skill of upgraded thinking: it requires you to simultaneously bring observation ability (identify X, Y), logical ability (explain Me's mechanism), analytical ability (predict Mo's boundary conditions), and research ability (design a verification plan). Master the variable model and you have mastered the shared skeleton of academic papers and business strategy reports.",
  m5_terms:[
    {front:"Predictor / X",back:"The variable you believe produces an effect. Also called the Independent Variable. E.g., advertising exposure."},
    {front:"Outcome / Y",back:"The result variable you want to explain or predict. Also called the Dependent Variable. E.g., purchase intention."},
    {front:"Mediator / Me",back:"The intermediate path by which X influences Y — explains 'Why' the effect occurs. E.g., brand familiarity."},
    {front:"Moderator / Mo",back:"The condition variable that changes the strength or direction of the X→Y causal relationship — explains 'Under what conditions'. E.g., product price level."},
    {front:"Falsifiability",back:"The core property of a good hypothesis: the capacity to be refuted by data or counterexamples. Non-falsifiable claims are not scientific hypotheses."},
    {front:"SEM (Structural Equation Modeling)",back:"A statistical method that simultaneously tests multiple variable relationships including mediators and moderators."},
  ],
  m5_q:[
    {q:"In 'Advertising Exposure (X) → Brand Familiarity (Me) → Purchase Intention (Y)', what role does Brand Familiarity play?",opts:["Predictor","Outcome","Mediator","Moderator"],ans:_A2,exp:"The Mediator is the intermediate path by which X influences Y — it explains 'Why' the effect occurs."},
    {q:"'When consumer risk aversion is high, advertising effectiveness drops significantly.' 'Risk aversion' is what type of variable?",opts:["Predictor X","Outcome Y","Mediator Me","Moderator Mo"],ans:_A3,exp:"The Moderator changes the strength or direction of the X→Y relationship — it answers 'Under what conditions is the effect different?'"},
    {q:"A good research hypothesis must have which core characteristic?",opts:["Supports the current mainstream view","Can be refuted by data or counterexamples (Falsifiability)","Has a large enough sample","Has mathematical formulas to support it"],ans:_A1,exp:"Falsifiability is the core of a scientific hypothesis. Claims that cannot be refuted do not belong to the scientific domain."},
    {q:"The most commonly used statistical method for quantitatively verifying a mediator (Me) is?",opts:["Descriptive statistics","Cross-tabulation","Structural Equation Modeling (SEM) or mediation analysis","Chi-square test"],ans:_A2,exp:"SEM or the Baron-Kenny mediation analysis procedure is the mainstream quantitative method for testing mediation effects."},
    {q:"What is the key difference between 'I think advertising works' and 'Advertising exposure (X) positively influences purchase intention (Y) through brand familiarity (Me)'?",opts:["The second version is longer and therefore better","The second version clearly specifies variables and mechanism, making it falsifiable","The first is qualitative; the second is quantitative","They are equivalent — just different levels of detail"],ans:_A1,exp:"A good hypothesis must clearly identify X, Y, and Me and be falsifiable. 'I think it works' cannot be measured or refuted, failing the scientific hypothesis standard."},
    {q:"Which statement best distinguishes a Mediator (Me) from a Moderator (Mo)?",opts:["Me is a continuous variable; Mo is categorical","Me explains the mechanism of X's effect on Y (Why); Mo determines when the X→Y effect is stronger or weaker (Under what conditions)","Me appears on the left of the model; Mo appears on the right","The two cannot be statistically distinguished"],ans:_A1,exp:"The Mediator answers 'Why does X affect Y?' (the pathway); the Moderator answers 'Under what conditions does the X→Y effect change?' (the boundary condition). The two are conceptually distinct."},
  ],

  m6_nav:"6. Data Storytelling", m6_title:"Ch6: Data Storytelling — Persuading with Data",
  m6_overview:"Data doesn't speak for itself — it needs humans to give it a narrative structure. Data Storytelling integrates data, visualization and narrative to produce communication tools that move decision-makers to action.",
  m6_highlights:["Data Visualization","Narrative Arc","SCQA Framework","Chart Selection","Audience Awareness","Call to Action"],
  m6_p1:"The core of data storytelling is not 'show all the data' but 'say the one most important thing'. McKinsey consulting training has a core principle: each slide can only have One Key Message. Data is the evidence supporting that message, not the protagonist itself.",
  m6_p2:"The SCQA framework is the skeleton of data storytelling: Situation: Establish common ground by describing a current state the audience recognizes. Complication: Introduce a turn — explain why the current state has created a problem or opportunity. Question: Clarify the core question. Answer: Your insight and recommendation. SCQA ensures your report starts from what the audience cares about, not from the data you collected.",
  m6_p3:"Chart selection principles: Comparison (Bar Chart), Trend (Line Chart), Proportion (Pie/Donut), Distribution (Histogram/Box Plot), Correlation (Scatter Plot). The wrong chart type can mislead judgment. The most common errors: using a pie chart to compare more than 5 categories, or using a line chart for unordered categorical data.",
  m6_p4:"Audience Awareness is the meta-skill of data storytelling. Senior executives need 'So what?' (What does this data mean for the business?); technical teams need 'How do we know?' (Data source and credibility); the general public needs 'Why should I care?' (What does this have to do with me?). The same dataset requires a different narrative entry point for different audiences.",
  m6_wrapup:"Data is the means; decisions are the goal. Good data storytelling ensures that when the audience leaves, they know: what they should believe, what they need to decide, and what action they should take. Next time you prepare a data report, work backward from these three questions — you'll find you need far less data than you thought.",
  m6_terms:[
    {front:"Data Storytelling",back:"The integration of data, visualization and narrative structure to influence audience understanding and decision-making."},
    {front:"SCQA Framework",back:"Situation / Complication / Question / Answer. The narrative skeleton from context to problem to answer."},
    {front:"One Key Message",back:"Each slide conveys only one core message; all other data serves as supporting evidence. A McKinsey report principle."},
    {front:"Audience Awareness",back:"Adjusting data presentation based on the audience's background, concerns and needs. The meta-skill of data storytelling."},
    {front:"Bar Chart",back:"Best for comparing values across discrete categories. Horizontal bars work best when category names are long."},
    {front:"Scatter Plot",back:"Best for exploring the relationship or distribution pattern between two continuous variables. Add a trend line to strengthen the message."},
  ],
  m6_q:[
    {q:"In the SCQA framework, 'C' stands for?",opts:["Concept","Complication","Conclusion","Case"],ans:_A1,exp:"C = Complication — the turning point that explains why the current situation has created a problem or noteworthy opportunity."},
    {q:"To show 'sales trends over the past 12 months', which chart type is most appropriate?",opts:["Pie Chart","Line Chart","Scatter Plot","Box Plot"],ans:_A1,exp:"A line chart is ideal for showing trends in time-series data — the first choice for trend analysis."},
    {q:"'One Key Message Per Slide' is a principle from which firm's consulting reports?",opts:["BCG","Deloitte","McKinsey","Bain"],ans:_A2,exp:"McKinsey is known for the 'One Key Message Per Slide' principle, requiring slide titles to be conclusive statements."},
    {q:"When presenting a data report to senior executives, the most critical audience question is?",opts:["Where does the data come from?","Is the statistical method rigorous?","What does this data mean for the business?","Is the sample size sufficient?"],ans:_A2,exp:"Senior executives most care about 'So what?' — the business implications and decision impact of the data, not technical details."},
    {q:"Which chart type is LEAST appropriate for comparing the market share of five brands?",opts:["Horizontal Bar Chart","Stacked Bar Chart","Pie Chart with more than 5 slices","Treemap"],ans:_A2,exp:"A Pie Chart with more than 5 slices makes it visually impossible to distinguish the areas clearly — the most common chart misuse. A horizontal bar or treemap is far clearer for this purpose."},
    {q:"What is the primary purpose of 'S (Situation)' in the SCQA framework?",opts:["To present surprising new data that shocks the audience","To establish a shared understanding of the current state as a starting point","To present the solution","To define the scope of analysis"],ans:_A1,exp:"Situation establishes a current-state consensus the audience already recognizes. This shared ground is the foundation from which Complication is introduced. Skipping S and jumping to C often creates a comprehension gap."},
  ],

// ── FlipCardDeck ──────────────────────────────────────────────────────────────
const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(()=>Math.random()-0.5));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const currentCardIndices = shuffledOrder.slice(groupIdx*groupSize, groupIdx*groupSize+groupSize);

  useEffect(()=>{
    const ns = new Set(shownSet);
    currentCardIndices.forEach(i=>ns.add(i));
    if(ns.size!==shownSet.size) setShownSet(ns);
  },[groupIdx]);

  const handleFlip = (origIdx) => {
    setFlipped(f=>({...f,[origIdx]:!f[origIdx]}));
    if(!readSet.has(origIdx)){
      const nr = new Set(readSet); nr.add(origIdx); setReadSet(nr);
      if(onCardRead) onCardRead(moduleId, nr.size, shownSet.size, terms.length);
    }
  };

  const statusText = t.flip_status.replace('{read}',readSet.size).replace('{shown}',shownSet.size).replace('{total}',terms.length);

  return (
    <div className="mt-8">
      <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">{t.key_terms}</h3>
      <p className="text-xs text-slate-400 dark:text-slate-500 mb-4">{statusText} · <span className="italic">{t.flip_prompt}</span></p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map(origIdx=>{
          const term = terms[origIdx];
          return (
            <div key={origIdx} className="perspective h-40 cursor-pointer" onClick={()=>handleFlip(origIdx)}>
              <div className={`relative w-full h-full transform-style-3d transition-transform duration-500 ${flipped[origIdx]?'rotate-y-180':''}`}>
                <div className="absolute inset-0 backface-hidden bg-white dark:bg-slate-800 rounded-xl border-2 border-[#D8C3A5]/40 dark:border-[#D8C3A5]/20 flex flex-col items-center justify-center p-4 shadow-sm">

// ── ModuleQuiz ─────────────────────────────────────────────────────────────────
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit, moduleName }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [shuffledMaps, setShuffledMaps] = useState([]);
  const groupSize = 2;
  const totalGroups = Math.ceil(questions.length / groupSize);
  const [qOrder] = useState(()=>[...Array(questions.length).keys()].sort(()=>Math.random()-0.5));

  useEffect(()=>{
    const maps = questions.map(q=>[...Array(q.opts.length).keys()].sort(()=>Math.random()-0.5));
    setShuffledMaps(maps);
  },[]);

  const currentStart = groupIdx * groupSize;
  const currentIndices = qOrder.slice(currentStart, currentStart+groupSize);
  const isGrpSub = !!submitted[groupIdx];

  const handleGroupSubmit = () => {
    const correct = currentIndices.reduce((acc,qi,i)=>{
      const selOrig = shuffledMaps[qi]?.[selected[currentStart+i]];
      return acc + (selOrig===_d(questions[qi].ans)?1:0);
    },0);
    const total = currentIndices.length;
    const wrongQs = currentIndices.filter((qi,i)=>{
      const selOrig = shuffledMaps[qi]?.[selected[currentStart+i]];
      return selOrig!==_d(questions[qi].ans);
    }).map(qi=>questions[qi].q);
    setSubmitted(s=>({...s,[groupIdx]:true}));
    const allCorrect = questions.reduce((a,_,qi)=>{
      const grp = Math.floor(qOrder.indexOf(qi)/groupSize);
      if(!submitted[grp]&&grp!==groupIdx) return a;
      const localI = currentIndices.indexOf(qi);
      if(localI<0) return a;
      const selOrig = shuffledMaps[qi]?.[selected[currentStart+localI]];
      return a+(selOrig===_d(questions[qi].ans)?1:0);
    },correct);
    if(onQuizSubmit) onQuizSubmit(moduleId, correct, total, wrongQs, moduleName);
  };

  // 累計所有已提交組別的答對數與已答數
  const totalCorrect = qOrder.reduce((acc, qi, flatI) => {
    const grp = Math.floor(flatI / groupSize);
    if (!submitted[grp]) return acc;
    const localI = flatI - grp * groupSize;
    const selOrig = shuffledMaps[qi]?.[selected[grp * groupSize + localI]];
    return acc + (selOrig === _d(questions[qi].ans) ? 1 : 0);
  }, 0);
  const totalAnswered = qOrder.reduce((acc, qi, flatI) => {
    const grp = Math.floor(flatI / groupSize);
    if (!submitted[grp]) return acc;
    return acc + 1;
  }, 0);
  const statusText = t.quiz_status
    .replace('{correct}', totalCorrect)
    .replace('{answered}', totalAnswered)
    .replace('{total}', questions.length);

  if(!shuffledMaps.length) return null;

  return (
    <div className="mt-8">
      <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">{t.quiz_title}</h3>
      <p className="text-xs text-slate-400 dark:text-slate-500 mb-4">{statusText}</p>
      <div className="space-y-6">
        {currentIndices.map((qi,localI)=>{
          const q = questions[qi];
          const globalI = currentStart + localI;
          return (
            <div key={qi} className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
              <p className="font-medium text-slate-800 dark:text-slate-200 mb-3">{q.q}</p>
              <div className="space-y-2">
                {shuffledMaps[qi].map((origIdx,dispIdx)=>{
                  const isSel = selected[globalI]===dispIdx;
                  const isCorr = shuffledMaps[qi][dispIdx]===_d(q.ans);
                  let cls = "w-full text-left px-4 py-3 rounded-lg border text-sm transition-all ";
                  if(!isGrpSub) cls += isSel?"border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5 dark:bg-[#D8C3A5]/5":"border-slate-200 dark:border-slate-600 hover:border-slate-400";
                  else if(isCorr) cls+="border-green-500 bg-green-50 dark:bg-green-900/20 text-green-800 dark:text-green-200 font-medium";
                  else if(isSel) cls+="border-red-400 bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-300";
                  else cls+="border-slate-200 dark:border-slate-600 opacity-50";
                  return <button key={dispIdx} onClick={()=>!isGrpSub&&setSelected(s=>({...s,[globalI]:dispIdx}))} className={cls}>{q.opts[origIdx]}</button>;
                })}
              </div>
              {isGrpSub && (
                <p className={`mt-3 text-sm italic ${shuffledMaps[qi][selected[globalI]]===_d(q.ans)?'text-green-600 dark:text-green-400':'text-red-500 dark:text-red-400'}`}>
                  {shuffledMaps[qi][selected[globalI]]===_d(q.ans)?`✓ ${t.correct}`:`✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
                </p>
              )}
            </div>
          );
        })}
      </div>
      <div className="flex gap-3 mt-4">
        {!isGrpSub
          ? <button onClick={handleGroupSubmit} disabled={!currentIndices.every((_,i)=>selected[currentStart+i]!==undefined)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx<totalGroups-1&&<button onClick={()=>setGroupIdx(g=>g+1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>}
              <button onClick={()=>{setGroupIdx(0);setSelected({});setSubmitted({});}} className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

        <g key={l}>
          <rect x={cx-45} y={cy-30} width={90} height={60} rx={8} fill={fill} stroke="#D8C3A5" strokeWidth="1.5"/>
          <text x={cx} y={cy-8} textAnchor="middle" fontSize="16" fontWeight="bold" fill="#D8C3A5">{l.split('\n')[0]}</text>
          <text x={cx} y={cy+10} textAnchor="middle" fontSize="9" fill="#D8C3A5">{l.split('\n')[1]}</text>
        </g>
      ))}
      <path d="M 115 80 L 155 80" stroke="#D8C3A5" strokeWidth="2" markerEnd="url(#arr3)"/>
      <path d="M 245 80 L 285 80" stroke="#D8C3A5" strokeWidth="2" markerEnd="url(#arr3)"/>
      <text x={200} y={135} textAnchor="middle" fontSize="10" fill="#888">Mo（干擾變數）↕ 改變效果強度</text>
      <defs><marker id="arr3" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#D8C3A5"/></marker></defs>

  6: () => (
    <svg viewBox="0 0 400 180" className="w-full max-w-lg mx-auto" onContextMenu={e=>{e.preventDefault();showCopyrightToast();}} draggable="false">
      {[['S\nSituation',60,90,'#004030'],['C\nComplication',150,90,'#2d6a4f'],['Q\nQuestion',240,90,'#1b4332'],['A\nAnswer',330,90,'#004030']].map(([l,cx,cy,fill])=>(
        <g key={l}>
          <circle cx={cx} cy={cy} r={38} fill={fill} stroke="#D8C3A5" strokeWidth="2"/>
          <text x={cx} y={cy-5} textAnchor="middle" fontSize="18" fontWeight="bold" fill="#D8C3A5">{l.split('\n')[0]}</text>
          <text x={cx} y={cy+12} textAnchor="middle" fontSize="8" fill="#D8C3A5">{l.split('\n')[1]}</text>
        </g>
      ))}
      {[0,1,2].map(i=>(
        <path key={i} d={`M ${98+i*90} 90 L ${112+i*90} 90`} stroke="#D8C3A5" strokeWidth="2" markerEnd="url(#arr4)"/>
      ))}
      <defs><marker id="arr4" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#D8C3A5"/></marker></defs>

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const LS_KEY = 'TU_SPA_analytics';
  const LS_STU = 'TU_SPA_student';
  const loadLS = (key,fb)=>{ try{const v=localStorage.getItem(key);return v?JSON.parse(v):fb;}catch{return fb;} };

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [toast, setToast] = useState('');
  const [studentInfo, setStudentInfo] = useState(()=>loadLS(LS_STU,{group:'',dept:'',id:'',nameEn:'',nameZh:''}));
  const [analytics, setAnalytics] = useState(()=>loadLS(LS_KEY,{
    time:Array(TOTAL).fill(0), clicks:Array(TOTAL).fill(0),
    quizCorrect:Array(TOTAL).fill(0), quizTotal:Array(TOTAL).fill(0),
    cardsRead:Array(TOTAL).fill(0), cardsTotal:Array(TOTAL).fill(0),
    wrongTopics:{}, visited:Array(TOTAL).fill(false)
  }));
  const contentRef = useRef(null);
  const menuRef = useRef(null);
  const timerRef = useRef(null);
  const t = dict[lang];

  useEffect(()=>{ document.documentElement.classList.toggle('dark',isDark); },[isDark]);
  useEffect(()=>{ try{localStorage.setItem(LS_KEY,JSON.stringify(analytics));}catch{} },[analytics]);
  useEffect(()=>{ try{localStorage.setItem(LS_STU,JSON.stringify(studentInfo));}catch{} },[studentInfo]);

  useEffect(()=>{
    setAnalytics(a=>{ const v=[...a.visited]; v[module]=true; return {...a,visited:v}; });
    if(contentRef.current) contentRef.current.scrollTo({top:0,behavior:'smooth'});
    speechSynthesis.cancel(); setTtsState('idle');
    clearInterval(timerRef.current);
    timerRef.current=setInterval(()=>{
      setAnalytics(a=>{ const tm=[...a.time]; tm[module]+=1; return {...a,time:tm}; });
    },1000);
    return ()=>clearInterval(timerRef.current);
  },[module]);

  useEffect(()=>{
    const handleClick = ()=>setAnalytics(a=>{ const c=[...a.clicks]; c[module]+=1; return {...a,clicks:c}; });
    document.addEventListener('click',handleClick);
    return ()=>document.removeEventListener('click',handleClick);
  },[module]);

  useEffect(()=>{
    const handleOut = (e)=>{ if(menuRef.current&&!menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown',handleOut);
    return ()=>document.removeEventListener('mousedown',handleOut);
  },[]);

  const handleQuizSubmit = (mid,correct,total,wrongQs) => {
    setAnalytics(a=>{
      const qc=[...a.quizCorrect],qt=[...a.quizTotal];
      qc[mid]=correct; qt[mid]=total;
      const wt={...a.wrongTopics}; wt[mid]=wrongQs||[];
      return {...a,quizCorrect:qc,quizTotal:qt,wrongTopics:wt};
    });
  };

  const handleCardRead = (mid,readCount,shownCount,totalCount) => {
    setAnalytics(a=>{
      const cr=[...a.cardsRead],ct=[...a.cardsTotal];
      cr[mid]=readCount; ct[mid]=totalCount;
      return {...a,cardsRead:cr,cardsTotal:ct};
    });
  };

  const goModule = (m) => { setModule(m); setMenuOpen(false); };

  const modulesList = [
    {id:0,icon:moduleIcons[0],nav:t.m0_nav,num:'0'},
    {id:1,icon:moduleIcons[1],nav:t.m1_nav,num:'1'},
    {id:2,icon:moduleIcons[2],nav:t.m2_nav,num:'2'},
    {id:3,icon:moduleIcons[3],nav:t.m3_nav,num:'3'},
    {id:4,icon:moduleIcons[4],nav:t.m4_nav,num:'4'},
    {id:5,icon:moduleIcons[5],nav:t.m5_nav,num:'5'},
    {id:6,icon:moduleIcons[6],nav:t.m6_nav,num:'6'},
    {id:IDX_LAB,icon:'⚡',nav:t.mlab_nav,num:'Lab'},
    {id:IDX_RES,icon:'🌐',nav:t.mres_nav,num:'Res'},
    {id:IDX_ANA,icon:'📈',nav:t.analytics_title,num:'Ana'},
  ];

  // TTS
  const handleTTS = (action) => {
    if(!('speechSynthesis' in window)) return;
    if(action==='stop'){ speechSynthesis.cancel(); setTtsState('idle'); return; }
    if(action==='pause'){ speechSynthesis.pause(); setTtsState('paused'); return; }
    if(action==='play'){
      if(ttsState==='paused'){ speechSynthesis.resume(); setTtsState('playing'); return; }
      speechSynthesis.cancel();
      const sep = lang==='zh'?'。 ':'. ';
      let texts=[];
      if(module===0){
        texts=[t.m0_title,t.m0_intro,t.m0_why,t.m0_why_desc,
          ...(t.m0_stats||[]).map(s=>`${s.label}: ${s.val}`),
          ...(t.m0_modules||[]).map(m=>`${m.title}. ${m.desc}`)];
      } else if(module>=1&&module<=NUM_LEARN){
        const mk=`m${module}`;
        texts=[t[`${mk}_title`],t[`${mk}_overview`],
          ...(t[`${mk}_highlights`]||[]),
          ...[1,2,3,4,5].map(n=>t[`${mk}_p${n}`]).filter(Boolean),
          ...(t[`${mk}_terms`]||[]).map(c=>`${c.front}. ${c.back}`),
          t[`${mk}_wrapup`]];
      } else if(module===IDX_LAB){
        texts=[t.mlab_title,t.mlab_desc,...(t.mlab_labs||[]).map(l=>`${l.title}. ${l.desc}`)];
      } else if(module===IDX_RES){
        texts=[t.mres_title,t.mres_desc];
      } else if(module===IDX_ANA){
        const tc=analytics.quizCorrect.reduce((a,b)=>a+b,0);
        const ta=analytics.quizTotal.reduce((a,b)=>a+b,0);
        const oa=ta>0?Math.round(tc/ta*100):0;
        texts=[t.analytics_title,t.analytics_desc,`${t.analytics_overall_acc}: ${oa}%`];
      }
      texts=texts.filter(Boolean);
      const utt=new SpeechSynthesisUtterance(texts.join(sep));
      utt.rate=0.95;
      const voices=speechSynthesis.getVoices();
      if(lang==='zh'){
        const v=voices.find(v=>v.lang==='zh-TW'&&v.name.includes('Yating'))||voices.find(v=>v.lang==='zh-TW')||voices.find(v=>v.lang.startsWith('zh'));
        if(v) utt.voice=v; utt.lang='zh-TW';
      } else {
        const v=voices.find(v=>v.lang==='en-GB'&&(v.name.includes('Male')||v.name.includes('Daniel')))||voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'));
        if(v) utt.voice=v; utt.lang='en-GB';
      }
      utt.onend=()=>setTtsState('idle');
      utt.onerror=()=>setTtsState('idle');
      speechSynthesis.speak(utt);
      setTtsState('playing');
    }
  };

  // CSV Export
  const handleExportCSV = () => {
    const {group,dept,id,nameEn,nameZh}=studentInfo;
    if(!group||!dept||!id||!nameEn||!nameZh){ alert(t.analytics_fill_required); return; }
    const dateStr=new Date().toISOString().split('T')[0].replace(/-/g,'');
    const fileName=`${t.brand} ${t.title}_${nameEn}_${nameZh}_${dateStr}.csv`;
    const headers=['Module','Time(s)','Clicks','Quiz Correct','Quiz Total','Cards Read','Cards Total','Wrong Questions'];
    const rows=modulesList.map(m=>{
      const i=m.id;
      return [m.nav,analytics.time[i]||0,analytics.clicks[i]||0,analytics.quizCorrect[i]||0,analytics.quizTotal[i]||0,analytics.cardsRead[i]||0,analytics.cardsTotal[i]||0,(analytics.wrongTopics[i]||[]).join(' | ')].join(',');
    });
    const meta=`Group,${group}\nDept,${dept}\nStudent ID,${id}\nEnglish Name,${nameEn}\nChinese Name,${nameZh}`;
    const csv='\uFEFF'+meta+'\n\n'+headers.join(',')+'\n'+rows.join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=fileName; a.click();
    URL.revokeObjectURL(url);
  };

  // Render modules
  const renderModule = () => {
    if(module===0) return <M0 t={t} goModule={goModule}/>;
    if(module>=1&&module<=NUM_LEARN) return <MLearn t={t} module={module} modulesList={modulesList} onQuizSubmit={handleQuizSubmit} onCardRead={handleCardRead} goModule={goModule} analytics={analytics} lang={lang}/>;
    if(module===IDX_LAB) return <MLab t={t} lang={lang} module={module} goModule={goModule}/>;
    if(module===IDX_RES) return <MRes t={t} module={module} goModule={goModule}/>;
    if(module===IDX_ANA) return <MAna t={t} analytics={analytics} setAnalytics={setAnalytics} modulesList={modulesList} studentInfo={studentInfo} setStudentInfo={setStudentInfo} onExport={handleExportCSV} goModule={goModule}/>;
  };

  return (
    <div className="flex flex-col h-screen overflow-hidden">
      {/* Toast */}
      {toast&&<div className="fixed bottom-12 right-4 z-[200] bg-[#004030] text-[#D8C3A5] px-5 py-3 rounded-xl shadow-xl text-sm font-medium">{toast}</div>}

      {/* Header */}
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="relative" ref={menuRef}>
              <button onClick={()=>setMenuOpen(!menuOpen)} className="p-2 hover:bg-white/10 rounded-lg" title={t.nav_modules}>
                {menuOpen?<IconX/>:<IconMenu/>}
              </button>
              {menuOpen&&(
                <div className="absolute top-full left-0 mt-1 w-64 max-h-[calc(100vh-5rem)] overflow-y-auto bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100]">
                  {modulesList.map(m=>(
                    <button key={m.id} onClick={()=>goModule(m.id)}
                      className={`w-full flex items-center gap-3 px-4 py-3 text-sm text-left transition-colors ${module===m.id?'bg-[#004030]/10 text-[#004030] dark:text-[#D8C3A5] font-bold':'text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700'}`}>
                      <span>{m.icon}</span>
                      <span className="truncate">{m.nav}</span>
                      {analytics.visited[m.id]&&<span className="ml-auto text-[10px] text-green-500">✓</span>}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={()=>goModule(0)} className="p-2 hover:bg-white/10 rounded-lg" title={t.nav_home}><IconHome size={18}/></button>
            <button onClick={()=>{if(contentRef.current)contentRef.current.scrollTo({top:0,behavior:'smooth'});}} className="flex items-center gap-2 hover:bg-white/10 rounded-lg px-2 py-1">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2">
            <button onClick={()=>handleTTS('play')} disabled={ttsState==='playing'} className="p-2 hover:bg-white/10 rounded-lg disabled:opacity-40" title={t.audio_read}><IconPlay/></button>
            <button onClick={()=>handleTTS('pause')} disabled={ttsState!=='playing'} className="p-2 hover:bg-white/10 rounded-lg disabled:opacity-40"><IconPause/></button>
            <button onClick={()=>handleTTS('stop')} disabled={ttsState==='idle'} className="p-2 hover:bg-white/10 rounded-lg disabled:opacity-40"><IconStop/></button>
            <button onClick={()=>setLang(l=>l==='en'?'zh':'en')} className="px-2 py-1 text-xs font-bold border border-[#D8C3A5]/40 rounded-lg hover:bg-white/10">
              <IconGlobe/><span className="ml-1">{lang==='en'?'中':'EN'}</span>
            </button>
            <button onClick={()=>setIsDark(d=>!d)} className="p-2 hover:bg-white/10 rounded-lg">
              {isDark?<IconSun/>:<IconMoon/>}
            </button>
          </div>
        </div>
      </header>

      {/* Sidebar + Content */}
      <div className="flex flex-1 pt-16 overflow-hidden">
        <aside className="hidden md:flex flex-col w-56 shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-700 overflow-y-auto">
          {modulesList.map(m=>(
            <button key={m.id} onClick={()=>goModule(m.id)}
              className={`flex items-center gap-2 px-4 py-3 text-sm text-left transition-colors border-l-4 ${module===m.id?'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5 text-[#004030] dark:text-[#D8C3A5] font-bold':'border-transparent text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>
              <span>{m.icon}</span>
              <span className="truncate text-xs">{m.nav}</span>
              {analytics.visited[m.id]&&<span className="ml-auto text-[10px] text-green-500">✓</span>}
            </button>
          ))}
        </aside>
        <main ref={contentRef} className="flex-1 overflow-y-auto pb-10">
          <div className="max-w-4xl mx-auto px-4 py-8 animate-fade-in" key={module}>
            {renderModule()}
          </div>
        </main>
      </div>

      {/* Footer */}
      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3">
          <span>{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">{t.architect_name}</a></span>
          <button onClick={()=>{if(contentRef.current)contentRef.current.scrollTo({top:0,behavior:'smooth'});}} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

// ── M0 ────────────────────────────────────────────────────────────────────────

  <div className="space-y-10">
    <div className="text-center space-y-4 py-8">
      <div className="text-6xl mb-2">🧠</div>
      <h1 className="font-serif font-black text-4xl md:text-5xl text-[#004030] dark:text-[#D8C3A5]">{t.m0_title}</h1>
      <p className="text-lg text-slate-500 dark:text-slate-400 font-serif italic">{t.subtitle}</p>

          <div className="text-xs text-slate-500 dark:text-slate-400 mt-1">{s.label}</div>

      ))}
    </div>
    <div>
      <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4">{t.nav_modules}</h3>
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {t.m0_modules.map((m,i)=>{
          const ids=[1,2,3,4,5,6,IDX_LAB,IDX_RES,IDX_ANA];

              <div className="flex items-center gap-2 mb-1">

    <div className="text-center">
      <button onClick={()=>goModule(1)} className="px-8 py-3 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-xl text-lg hover:opacity-90 transition-all shadow-lg">{t.m0_start}</button>
