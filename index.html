// ── MLearn ────────────────────────────────────────────────────────────────────
const MLearn = ({t,module,modulesList,onQuizSubmit,onCardRead,goModule,analytics,lang}) => {
  const mk = `m${module}`;
  const SVGComp = moduleSVGs[module];
  return (
    <div className="space-y-8">
      <H2 icon={modulesList[module]?.icon} number={module}>{t[`${mk}_title`]}</H2>
      {/* 1. Overview */}
      <div className="bg-[#004030]/5 dark:bg-[#D8C3A5]/5 rounded-xl p-5 border-l-4 border-[#D8C3A5]">
        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">{t.overview_label}</h3>
        <p className="text-slate-700 dark:text-slate-300">{t[`${mk}_overview`]}</p>
      </div>
      {/* 2. Highlights */}
      <div>
        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">{t.highlights_label}</h3>
        <div className="flex flex-wrap gap-2">
          {(t[`${mk}_highlights`]||[]).map((h,i)=>(
            <span key={i} className="px-3 py-1 bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] rounded-full text-sm font-medium">{h}</span>
          ))}
        </div>
      </div>
      {/* 3. Deep Dive */}
      <div className="space-y-4">
        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">{t.deep_dive_label}</h3>
        <p className="text-slate-700 dark:text-slate-300 leading-relaxed">{t[`${mk}_p1`]}</p>
        {t[`${mk}_p2`]&&<p className="p-4 bg-slate-100 dark:bg-slate-800 rounded-lg italic font-serif text-slate-600 dark:text-slate-400 leading-relaxed">{t[`${mk}_p2`]}</p>}
        {t[`${mk}_p3`]&&<p className="text-slate-700 dark:text-slate-300 leading-relaxed">{t[`${mk}_p3`]}</p>}
        {t[`${mk}_p4`]&&<p className="text-slate-700 dark:text-slate-300 leading-relaxed">{t[`${mk}_p4`]}</p>}
        {t[`${mk}_p5`]&&<p className="text-slate-700 dark:text-slate-300 leading-relaxed">{t[`${mk}_p5`]}</p>}
      </div>
      {/* 4. SVG */}
      {SVGComp&&(
        <div className="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 flex justify-center">
          <SVGComp/>
        </div>
      )}
      {/* 5. FlipCardDeck */}
      <FlipCardDeck key={`cards-${module}`} terms={t[`${mk}_terms`]||[]} t={t} moduleId={module} onCardRead={onCardRead}/>
      {/* 6. Wrap-up */}
      <div className="bg-slate-100 dark:bg-slate-800 rounded-xl p-5">
        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">{t.wrapup_label}</h3>
        <p className="italic text-slate-600 dark:text-slate-400 leading-relaxed">{t[`${mk}_wrapup`]}</p>
      </div>
      {/* 7. Quiz */}
      <ModuleQuiz key={`quiz-${module}`} questions={t[`${mk}_q`]||[]} t={t} moduleId={module} onQuizSubmit={onQuizSubmit} moduleName={t[`${mk}_title`]}/>
      {/* 8. Nav */}
      <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700">
        <button onClick={()=>goModule(Math.max(0,module-1))} disabled={module===0} className="px-4 py-2 text-sm font-bold text-[#004030] dark:text-[#D8C3A5] border border-[#004030] dark:border-[#D8C3A5] rounded-lg disabled:opacity-0">{t.nav_prev}</button>
        <button onClick={()=>goModule(Math.min(TOTAL-1,module+1))} disabled={module===TOTAL-1} className="px-4 py-2 text-sm font-bold bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg disabled:opacity-0">{t.nav_next}</button>
      </div>
    </div>
  );
};

// ── MLab ─────────────────────────────────────────────────────────────────────
const MLab = ({t,lang,module,goModule}) => {
  const [active, setActive] = useState(null);
  const labComps = [LabORID,LabLogicSelector,LabVariableModel,LabCaseWorkshop];
  return (
    <div className="space-y-8">
      <H2 icon="⚡" number="Lab">{t.mlab_title}</H2>
      <p className="text-slate-600 dark:text-slate-400">{t.mlab_desc}</p>
      <div className="grid sm:grid-cols-2 gap-4">
        {(t.mlab_labs||[]).map((lab,i)=>(
          <button key={i} onClick={()=>setActive(active===i?null:i)}
            className={`text-left p-5 rounded-xl border-2 transition-all ${active===i?'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5 dark:bg-[#D8C3A5]/5':'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-slate-400'}`}>
            <p className="font-bold text-[#004030] dark:text-[#D8C3A5] text-sm mb-1">{lab.title}</p>
            <p className="text-xs text-slate-500 dark:text-slate-400">{lab.desc}</p>
          </button>
        ))}
      </div>
      {active!==null&&(
        <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700 animate-fade-in">
          <h4 className="font-bold text-[#004030] dark:text-[#D8C3A5] mb-4">{t.mlab_labs[active].title}</h4>
          {React.createElement(labComps[active],{lang})}
        </div>
      )}
      <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700">
        <button onClick={()=>goModule(NUM_LEARN)} className="px-4 py-2 text-sm font-bold text-[#004030] dark:text-[#D8C3A5] border border-[#004030] dark:border-[#D8C3A5] rounded-lg">{t.nav_prev}</button>
        <button onClick={()=>goModule(IDX_RES)} className="px-4 py-2 text-sm font-bold bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg">{t.nav_next}</button>
      </div>
    </div>
  );
};

// ── MRes ─────────────────────────────────────────────────────────────────────
const MRes = ({t,module,goModule}) => {
  const resources = [
    {label:"Ep.32 Essence: Secrets of Observation & Analysis (7 min)",url:"https://youtu.be/PH4WWPA6lhk",desc:"快速掌握觀察與分析的核心心法"},
    {label:"Ep.32a Full Lecture: Deep Dive into Critical Thinking (34 min)",url:"https://youtu.be/p-CNjDzMO8I",desc:"完整版批判性思考深度講座"},
    {label:"McKinsey Quarterly — Critical Thinking",url:"https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights",desc:"McKinsey 策略思維洞見文章"},
    {label:"WEF Future of Jobs Report",url:"https://www.weforum.org/reports/the-future-of-jobs-report-2023/",desc:"未來工作技能排行榜與趨勢分析"},
    {label:"NCNU IBS Faculty Page",url:"https://www.ibs.ncnu.edu.tw/index.php/faculty/tenured-professor/299-smlo",desc:"Prof. Shihmin Lo 研究與教學資訊"},
  ];
  return (
    <div className="space-y-8">
      <H2 icon="🌐" number="Res">{t.mres_title}</H2>
      <p className="text-slate-600 dark:text-slate-400">{t.mres_desc}</p>
      <div className="grid sm:grid-cols-2 gap-4">
        {resources.map((r,i)=><LinkCard key={i} label={r.label} url={r.url} desc={r.desc}/>)}
      </div>
      <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700">
        <button onClick={()=>goModule(IDX_LAB)} className="px-4 py-2 text-sm font-bold text-[#004030] dark:text-[#D8C3A5] border border-[#004030] dark:border-[#D8C3A5] rounded-lg">{t.nav_prev}</button>
        <button onClick={()=>goModule(IDX_ANA)} className="px-4 py-2 text-sm font-bold bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg">{t.nav_next}</button>
      </div>
    </div>
  );
};

// ── MAna ─────────────────────────────────────────────────────────────────────
const MAna = ({t,analytics,setAnalytics,modulesList,studentInfo,setStudentInfo,onExport,goModule}) => {
  const [tick, setTick] = useState(0);
  useEffect(()=>{
    const id = setInterval(()=>setTick(n=>n+1), 1000);
    return ()=>clearInterval(id);
  },[]);

  const tc=analytics.quizCorrect.reduce((a,b)=>a+b,0);
  const ta=analytics.quizTotal.reduce((a,b)=>a+b,0);
  const oa=ta>0?Math.round(tc/ta*100):0;
  const totalTime=analytics.time.reduce((a,b)=>a+b,0);
  const totalClicks=analytics.clicks.reduce((a,b)=>a+b,0);
  const totalCards=analytics.cardsRead.reduce((a,b)=>a+b,0);
  const totalCardsT=analytics.cardsTotal.reduce((a,b)=>a+b,0);
  const cardRate=totalCardsT>0?Math.round(totalCards/totalCardsT*100):0;

  const sanitizeId=(v)=>v.replace(/[^0-9]/g,'').slice(0,12);
  const sanitizeName=(v)=>v.replace(/[<>"'&\\]/g,'').slice(0,50);

  const weakModules=modulesList.filter(m=>m.id>=1&&m.id<=NUM_LEARN&&analytics.quizTotal[m.id]>0&&Math.round(analytics.quizCorrect[m.id]/analytics.quizTotal[m.id]*100)<75)
    .map(m=>({name:m.nav,acc:Math.round(analytics.quizCorrect[m.id]/analytics.quizTotal[m.id]*100),id:m.id}))
    .sort((a,b)=>a.acc-b.acc);

  const handleClear=()=>{
    if(confirm(t.analytics_wp_clear_confirm)){
      const fresh={time:Array(TOTAL).fill(0),clicks:Array(TOTAL).fill(0),quizCorrect:Array(TOTAL).fill(0),quizTotal:Array(TOTAL).fill(0),cardsRead:Array(TOTAL).fill(0),cardsTotal:Array(TOTAL).fill(0),wrongTopics:{},visited:Array(TOTAL).fill(false)};
      setAnalytics(fresh);
      try{localStorage.removeItem('TU_SPA_analytics');}catch{}
    }
  };

  return (
    <div className="space-y-8">
      <H2 icon="📈" number="Ana">{t.analytics_title}</H2>
      <p className="text-slate-500 dark:text-slate-400 text-sm">{t.analytics_wp_saved}</p>

      {/* Stat Cards */}
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
        {[
          [totalTime+t.analytics_sec, t.analytics_total_time],
          [totalClicks+t.analytics_times, t.analytics_total_clicks],
          [oa+'%', t.analytics_overall_acc],
          [cardRate+'%', t.analytics_card_usage],
        ].map(([val,lbl],i)=>(
          <div key={i} className="bg-white dark:bg-slate-800 rounded-xl p-4 text-center border border-slate-200 dark:border-slate-700">
            <div className="text-2xl font-black font-serif text-[#004030] dark:text-[#D8C3A5]">{val}</div>
            <div className="text-xs text-slate-500 dark:text-slate-400 mt-1">{lbl}</div>
          </div>
        ))}
      </div>

      {/* Progress */}
      <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
        <h3 className="font-bold text-sm uppercase tracking-wider text-slate-500 mb-4">{t.analytics_progress_title}</h3>
        <div className="space-y-2">
          {(() => {
            const maxTime = Math.max(...modulesList.map(m => analytics.time[m.id]||0), 1);
            return modulesList.map(m=>{
              const vis=analytics.visited[m.id];
              const t_sec=analytics.time[m.id]||0;
              const pct=Math.round(t_sec/maxTime*100);
              const hasQuiz=m.id>=1&&m.id<=NUM_LEARN;
              const qDone=hasQuiz&&analytics.quizTotal[m.id]>0;
              const acc=qDone?Math.round(analytics.quizCorrect[m.id]/analytics.quizTotal[m.id]*100):null;
              return (
                <button key={m.id} onClick={()=>goModule(m.id)} className="w-full flex items-center gap-3 text-left hover:bg-slate-50 dark:hover:bg-slate-700 rounded-lg p-2 transition-colors">
                  <span className="text-base">{m.icon}</span>
                  <span className="text-xs text-slate-600 dark:text-slate-400 w-28 truncate">{m.nav}</span>
                  <div className="flex-1 bg-slate-100 dark:bg-slate-700 rounded-full h-2">
                    <div className="h-2 rounded-full bg-[#004030] dark:bg-[#D8C3A5] transition-all duration-500" style={{width: vis ? `${Math.max(pct,4)}%` : '0%'}}/>
                  </div>
                  <span className={`text-xs font-medium w-20 text-right tabular-nums ${vis?'text-green-500':'text-slate-400'}`}>
                    {vis ? `${t_sec}s` : t.analytics_progress_not_visited}
                    {acc!==null?` · ${acc}%`:''}
                  </span>
                </button>
              );
            });
          })()}
        </div>
        <p className="text-[10px] text-slate-400 mt-3">{t.analytics_sec==='秒'?'進度條長度依各模組停留時間比例顯示（最長為基準 100%）':'Bar length proportional to time spent per module (longest = 100%).'}</p>
      </div>

      {/* Weakness */}
      <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
        <h3 className="font-bold text-sm uppercase tracking-wider text-slate-500 mb-4">{t.analytics_wp_title}</h3>
        {weakModules.length>0
          ? weakModules.map(m=>(
            <div key={m.id} className="mb-4 p-4 bg-red-50 dark:bg-red-900/20 rounded-lg border border-red-200 dark:border-red-800">
              <div className="flex items-center justify-between mb-2">
                <span className="font-bold text-sm text-red-700 dark:text-red-300">{m.name}</span>
                <span className="text-sm font-bold text-red-600">{m.acc}%</span>
              </div>
              {(analytics.wrongTopics[m.id]||[]).length>0&&(
                <p className="text-xs text-red-600 dark:text-red-400 mb-2">{t.analytics_wp_incorrect} {(analytics.wrongTopics[m.id]||[]).join(' / ')}</p>
              )}
              <button onClick={()=>goModule(m.id)} className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] underline">{t.analytics_wp_goto}</button>
            </div>
          ))
          : ta>0&&<p className="text-green-600 dark:text-green-400 text-sm">{t.analytics_wp_allpass}</p>
        }
      </div>

      {/* Detail Table */}
      <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 overflow-x-auto">
        <h3 className="font-bold text-sm uppercase tracking-wider text-slate-500 mb-4">{t.analytics_module}</h3>
        <table className="w-full text-xs">
          <thead>
            <tr className="border-b border-slate-200 dark:border-slate-700">
              {[t.analytics_module,t.analytics_time,t.analytics_clicks,t.analytics_correct_ans_total,t.analytics_cards_read_total].map(h=>(
                <th key={h} className="text-left py-2 px-2 text-slate-500">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {modulesList.map(m=>(
              <tr key={m.id} className="border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/30">
                <td className="py-2 px-2 font-medium text-slate-700 dark:text-slate-300">{m.nav}</td>
                <td className="py-2 px-2 text-slate-500">{analytics.time[m.id]||0}s</td>
                <td className="py-2 px-2 text-slate-500">{analytics.clicks[m.id]||0}</td>
                <td className="py-2 px-2 text-slate-500">{analytics.quizTotal[m.id]>0?`${analytics.quizCorrect[m.id]}/${analytics.quizTotal[m.id]}`:t.analytics_no_data}</td>
                <td className="py-2 px-2 text-slate-500">{analytics.cardsTotal[m.id]>0?`${analytics.cardsRead[m.id]}/${analytics.cardsTotal[m.id]}`:'-'}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Student Info Form */}
      <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
        <h3 className="font-bold text-sm uppercase tracking-wider text-slate-500 mb-4">{t.analytics_form_title}</h3>
        <div className="grid sm:grid-cols-2 gap-4">
          <div>
            <label className="text-xs font-medium text-slate-500 mb-1 block">{t.analytics_group}</label>
            <select value={studentInfo.group} onChange={e=>setStudentInfo(s=>({...s,group:e.target.value}))} className="w-full p-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm">
              <option value="">{t.analytics_group_select}</option>
              {t.group_options.map(g=><option key={g} value={g}>{g}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500 mb-1 block">{t.analytics_dept}</label>
            <input value={studentInfo.dept} onChange={e=>setStudentInfo(s=>({...s,dept:sanitizeName(e.target.value)}))} placeholder={t.analytics_dept_ph} className="w-full p-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm"/>
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500 mb-1 block">{t.analytics_id}</label>
            <input value={studentInfo.id} onChange={e=>setStudentInfo(s=>({...s,id:sanitizeId(e.target.value)}))} placeholder={t.analytics_id_ph} className="w-full p-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm"/>
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500 mb-1 block">{t.analytics_name_en}</label>
            <input value={studentInfo.nameEn} onChange={e=>setStudentInfo(s=>({...s,nameEn:sanitizeName(e.target.value)}))} placeholder={t.analytics_name_en_ph} className="w-full p-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm"/>
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500 mb-1 block">{t.analytics_name_zh}</label>
            <input value={studentInfo.nameZh} onChange={e=>setStudentInfo(s=>({...s,nameZh:sanitizeName(e.target.value)}))} placeholder={t.analytics_name_zh_ph} className="w-full p-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm"/>
          </div>
        </div>
        <div className="flex gap-3 mt-5 flex-wrap">
          <button onClick={onExport} className="px-5 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg text-sm">{t.analytics_export_csv}</button>
          <button onClick={handleClear} className="px-5 py-2 bg-red-600 text-white font-bold rounded-lg text-sm hover:bg-red-700">{t.analytics_wp_clear}</button>
        </div>
        {!(studentInfo.group&&studentInfo.dept&&studentInfo.id&&studentInfo.nameEn&&studentInfo.nameZh)&&(
          <p className="text-xs text-slate-400 mt-2">{t.analytics_fill_required}</p>
        )}
      </div>

      <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700">
        <button onClick={()=>goModule(IDX_RES)} className="px-4 py-2 text-sm font-bold text-[#004030] dark:text-[#D8C3A5] border border-[#004030] dark:border-[#D8C3A5] rounded-lg">{t.nav_prev}</button>
        <button onClick={()=>goModule(0)} className="px-4 py-2 text-sm font-bold bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg">{t.nav_home}</button>
      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
